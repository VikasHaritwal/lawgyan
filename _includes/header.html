<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.brand }}, home">
      <span class="brand-mark" aria-hidden="true">{{ site.brand | slice: 0 }}</span>
      <span class="brand-text">
        <span class="brand-name">Law<em>Gyan</em></span>
        <span class="brand-role">by {{ site.author_name }}, {{ site.author_title }}</span>
      </span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      {% assign here = page.url %}
      <a href="{{ '/blog/' | relative_url }}" {% if here contains '/blog' %}aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/topics/' | relative_url }}" {% if here == '/topics/' %}aria-current="page"{% endif %}>Topics</a>
      <a href="{{ '/about/' | relative_url }}" {% if here == '/about/' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}" {% if here == '/contact/' %}aria-current="page"{% endif %}>Contact</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </nav>
  </div>
</header>
